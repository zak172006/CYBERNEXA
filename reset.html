<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <title>Reset Password | CYBERNEXA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-head">
                <a href="index.html" class="logo">
                    <span class="logo-icon">N</span>
                    CYBER<span>NEXA</span>
                </a>
                <h1>Set a new password</h1>
                <p>Choose a new password for your account.</p>
            </div>

            <div class="form-error" id="formError"></div>
            <div class="form-success" id="formSuccess"></div>

            <form id="resetForm" novalidate>
                <div class="field">
                    <label for="password">New password</label>
                    <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="auth-submit" id="submitBtn">Update Password ↗</button>
            </form>

            <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script>
        const form = document.getElementById('resetForm');
        const errorBox = document.getElementById('formError');
        const successBox = document.getElementById('formSuccess');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password.length < 8) {
                errorBox.textContent = 'Password must be at least 8 characters.';
                errorBox.classList.add('show');
                return;
            }
            if (password !== confirm) {
                errorBox.textContent = 'Passwords do not match.';
                errorBox.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';
            const result = await updatePassword(password);

            if (!result.ok) {
                errorBox.textContent = result.error + ' (Open this page from the link in your reset email.)';
                errorBox.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password ↗';
                return;
            }

            successBox.textContent = 'Password updated. Redirecting to your dashboard...';
            successBox.classList.add('show');
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <title>Create Account | CYBERNEXA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-head">
                <a href="index.html" class="logo">
                    <span class="logo-icon">N</span>
                    CYBER<span>NEXA</span>
                </a>
                <h1>Create your account</h1>
                <p>Start protecting your digital infrastructure today.</p>
            </div>

            <div class="form-error" id="formError"></div>

            <form id="registerForm" novalidate>
                <div class="field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
                    <div class="strength-meter" id="strengthMeter">
                        <span></span><span></span><span></span>
                    </div>
                    <span class="strength-label" id="strengthLabel">Use 8+ characters with a mix of letters, numbers &amp; symbols</span>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="auth-submit" id="submitBtn">Create Account ↗</button>
            </form>

            <div class="auth-divider">OR</div>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const errorBox = document.getElementById('formError');
        const submitBtn = document.getElementById('submitBtn');
        const passwordInput = document.getElementById('password');
        const strengthBars = document.querySelectorAll('#strengthMeter span');
        const strengthLabel = document.getElementById('strengthLabel');
        function passwordStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            if (score <= 2) return 'weak';
            if (score <= 3) return 'fair';
            return 'strong';
        }

        getSession().then(session => {
            if (session) window.location.href = 'dashboard.html';
        });

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            strengthBars.forEach(b => b.className = '');
            if (!val) {
                strengthLabel.textContent = 'Use 8+ characters with a mix of letters, numbers & symbols';
                return;
            }
            const level = passwordStrength(val);
            const fillCount = level === 'weak' ? 1 : level === 'fair' ? 2 : 3;
            strengthBars.forEach((b, i) => {
                if (i < fillCount) b.className = level;
            });
            strengthLabel.textContent = level === 'weak' ? 'Weak password'
                : level === 'fair' ? 'Fair password'
                : 'Strong password';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!name || !email || !password || !confirmPassword) {
                errorBox.textContent = 'Please fill in all fields.';
                errorBox.classList.add('show');
                return;
            }
            if (password.length < 8) {
                errorBox.textContent = 'Password must be at least 8 characters.';
                errorBox.classList.add('show');
                return;
            }
            if (password !== confirmPassword) {
                errorBox.textContent = 'Passwords do not match.';
                errorBox.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            const result = await registerUser({ name, email, password });

            if (!result.ok) {
                errorBox.textContent = result.error;
                errorBox.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account ↗';
                return;
            }

            if (result.needsConfirmation) {
                window.location.href = 'login.html?confirm=1';
                return;
            }

            window.location.href = 'login.html?registered=1';
        });
    </script>
</body>
</html>
